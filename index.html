<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>동선팩 (무료 지도)</title>
<script src="firebase-config.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: 차분하고 친절한 여행 앱, 큰 글씨·큰 버튼
   IDEA: 실제 여행자 동선을 실제 좌표 위 번호 핀으로 따라가는 '동선 카드'
   PICTURE: 날짜별 동선 지도(실제 위·경도 비율, 점선 경로, 축척)
   COLOUR and TYPE: 흰 바탕·진남색 글자·파랑 주색·노랑 인증 배지 / Noto Sans KR
   LAYOUT: 휴대폰 한 열, 상단 바 + 스크롤 본문 + 하단 고정 버튼/탭 */
:root{color-scheme:light dark;--bg:light-dark(#f4f6f9,#0f1420);--card:light-dark(#fff,#182033);--ink:light-dark(#141b2b,#eef2f8);--sub:light-dark(#4b5567,#aab4c6);--line:light-dark(#e1e5ec,#2a3550);--pri:light-dark(#1f4fbf,#7ea6ff);--priInk:light-dark(#fff,#0f1420);--soft:light-dark(#eef3ff,#1d2a4a);--yel:#ffd84a;--yelInk:#3a2c00;--warn:light-dark(#fff3e2,#3a2a14);--warnLine:light-dark(#d9821a,#e7a14a);--warnInk:light-dark(#6a3a00,#ffd9a8);--map:light-dark(#e9eef5,#172036);--grid:light-dark(#d6dee9,#24304d);--red:light-dark(#b42318,#ff9b8f);--sea:light-dark(#d9e7f5,#13203a);--land:light-dark(#f6f3ea,#26314c);--coast:light-dark(#b9c4d2,#3d4b6b);--rail:light-dark(#8e99ad,#56637f)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:light-dark(#dfe4ec,#080b12);color:var(--ink);font:16px/1.55 'Noto Sans KR',system-ui,sans-serif;overflow-x:clip}
body.big{font-size:19px}
.app{position:relative;max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;background:var(--bg);box-shadow:0 0 0 1px var(--line);overflow:hidden}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--line);min-height:62px}
header h1{flex:1;margin:0;font-size:1.15em;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button,select{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.ib{width:44px;height:44px;border:0;background:none;display:grid;place-items:center;border-radius:10px;flex-shrink:0}
.pill{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:.85em;white-space:nowrap}
.pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{flex:1;overflow-y:auto;padding:18px 16px 28px;display:flex;flex-direction:column;gap:16px}
h2{margin:0;font-size:1.45em;line-height:1.3;font-weight:900;text-wrap:balance}
h3{margin:0;font-size:1.05em;font-weight:700}
p{margin:0}.sub{color:var(--sub);font-size:.88em}.xs{font-size:.78em}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:18px;border:1px solid var(--line);background:var(--card);font-size:.85em;min-height:40px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
.pack{display:flex;flex-direction:column;text-align:left;padding:0;overflow:hidden;width:100%}
.cover{height:92px;width:100%;display:flex;align-items:flex-end;justify-content:space-between;padding:12px 16px;color:#fff}
.cover b{font-size:1.3em;font-weight:900}.cover span{font-size:.82em}
.pbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;width:100%}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;background:var(--yel);color:var(--yelInk);font-size:.75em;font-weight:700}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;background:var(--soft);font-size:.75em;font-weight:700;white-space:nowrap}
.tag.food{background:light-dark(#fde8dc,#43281a)}
.price{font-weight:700;white-space:nowrap}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabs button{flex:1 0 auto;min-width:64px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:.85em;padding:0 10px}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.map{position:relative;aspect-ratio:4/3;border-radius:16px;overflow:hidden;background:var(--map);border:1px solid var(--line)}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:0}
.pin b{width:30px;height:30px;border-radius:50%;color:#fff;border:3px solid var(--card);display:grid;place-items:center;font-size:13px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.pin span{padding:1px 6px;border-radius:6px;background:var(--card);font-size:11px;font-weight:700;white-space:nowrap;color:var(--ink)}
.scale{position:absolute;left:10px;bottom:8px;font-size:11px;color:var(--sub);display:flex;flex-direction:column;gap:2px}
.scale i{display:block;height:4px;border:2px solid var(--sub);border-top:0}
.mapnote{position:absolute;right:8px;top:8px;font-size:11px;color:var(--sub);background:var(--card);padding:2px 6px;border-radius:6px}
.maplinks{display:flex;gap:8px;flex-wrap:wrap}
.maplinks a{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:12px;background:var(--soft);color:var(--pri);font-weight:700;font-size:.88em;text-decoration:none}
.tl{display:flex;flex-direction:column}
.st{display:flex;gap:12px}
.rail{display:flex;flex-direction:column;align-items:center;width:32px;flex-shrink:0}
.dot{width:32px;height:32px;border-radius:50%;background:var(--pri);color:var(--priInk);display:grid;place-items:center;font-weight:700;font-size:.85em}
.dot.off{background:#8a93a3}.dot.new{background:#d9821a}
.bar{width:2px;flex:1;min-height:18px;background:var(--line)}
.sb{flex:1;display:flex;flex-direction:column;gap:4px;padding-bottom:16px}
.stop{text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.stop b{font-size:1em}
.move{font-size:.78em;color:var(--pri);font-weight:700;margin-top:2px}
.ed{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.ed button,.ed select{min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:0 10px;font-size:.82em;font-weight:700}
.ed .del{color:var(--red)}
.list{padding:16px;display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);text-align:left;width:100%;min-height:58px}
.opt.on{border-color:var(--pri);background:var(--soft)}
.box{width:26px;height:26px;border-radius:7px;border:2px solid #8a93a3;display:grid;place-items:center;flex-shrink:0}
.opt.on .box{background:var(--pri);border-color:var(--pri)}
.grow{flex:1;display:flex;flex-direction:column;gap:2px}
.foot{padding:12px 16px 16px;background:var(--card);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.btns{display:flex;gap:8px}
.btn{flex:1;min-height:54px;border-radius:12px;border:0;background:var(--pri);color:var(--priInk);font-weight:700;padding:0 12px}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--ink)}
.btn.dark{background:var(--ink);color:var(--bg)}
nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--card);border-top:1px solid var(--line)}
nav button{height:62px;border:0;background:none;font-size:.85em;color:var(--sub);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button.on{color:var(--pri);font-weight:700}
.warn{background:var(--warn);border:2px solid var(--warnLine);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;color:var(--warnInk)}
.alt{background:var(--card);color:var(--ink);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
.done{background:var(--soft);border:2px solid var(--pri);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.ok{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 0;text-align:center}
.ok i{width:64px;height:64px;border-radius:50%;background:var(--pri);display:grid;place-items:center}
textarea,input[type=text]{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:16px;background:var(--card);color:var(--ink)}
textarea{resize:none}
a{color:var(--pri)}
.note{font-size:.78em;color:var(--sub);text-align:center}
.sheet{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:5}
.pts{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:.92em}
.srcs{display:flex;flex-direction:column;gap:4px;font-size:.8em}
.menu{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.menu li{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px dashed var(--line)}
.menu li:last-child{border-bottom:0}
.menu .mn{flex:1}
.menu .mp{font-weight:700;white-space:nowrap;color:var(--pri)}
.menu .mp.na{font-weight:400;color:var(--sub);font-size:.85em}
.mbox{background:var(--soft);border-radius:12px;padding:8px 12px}
.hcard{border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;background:var(--card)}
.hcard.on{border-color:var(--pri);box-shadow:0 0 0 2px color-mix(in srgb,var(--pri) 25%,transparent)}
.hcard .hp{font-weight:700;color:var(--pri)}
.hcard ul{margin:2px 0 0;padding-left:18px;font-size:.88em}
.hlist{display:flex;flex-direction:column;gap:8px}
.mbox h4{margin:0 0 2px;font-size:.88em}
.stars{display:flex;gap:4px}
.stars button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:1.2em;color:#b8860b}
.stars button.on{background:#fff4cc;border-color:#e5c43a}
.rev{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:4px}
.rev .s{color:#b8860b;letter-spacing:1px}
.fbk{position:fixed;inset:0;z-index:5000;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.fbk[hidden]{display:none}
.fbk .fkbox{background:var(--bg);color:var(--ink);width:100%;max-width:640px;max-height:92vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden}
.web .fbk{align-items:center}.web .fbk .fkbox{border-radius:20px;max-height:86vh}
.fbk .bh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--card)}
.fbk .bh h2{margin:0;font-size:1.15em;flex:1}
.fbk .bb{overflow:auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:12px}
.fbk form{display:flex;flex-direction:column;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.fbk input,.fbk textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:44px}
.fbk textarea{min-height:76px;resize:vertical}
.fbk .stars{display:flex;gap:2px}
.fbk .stars button{border:0;background:none;font-size:1.6em;min-width:44px;min-height:44px;color:#b8860b;padding:0}
.fbk .post{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.fbk .meta{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.fbk .meta .s{color:#b8860b;letter-spacing:1px}
.fbk .txt{margin:0;white-space:pre-wrap;word-break:break-word}
.fbk .reps{border-left:3px solid var(--line);margin-left:4px;padding-left:10px;display:flex;flex-direction:column;gap:8px}
.fbk .rp{display:flex;flex-direction:column;gap:2px}
.fbk .lnk{border:0;background:none;color:var(--pri);font-weight:700;padding:0 4px;min-height:36px;align-self:flex-start;font-size:.9em}
.fbk .rform{background:var(--bg);padding:8px;border-radius:10px}
.fbk .sm{min-height:44px;flex:0 0 auto;padding:0 16px}
.fbk .tabs2{display:flex;gap:6px}
.fbk .tabs2 button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;min-height:40px;padding:0 14px;font-weight:700}
.fbk .tabs2 button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.srv .fkbox{max-width:440px}
.web .srv .fkbox,.srv .fkbox{border-radius:20px}
.srv{align-items:center;padding:16px;z-index:5100}
.srv .q{font-size:1.15em;font-weight:800;margin:0;line-height:1.45}
.srv .ages{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.srv .ages button,.srv .yn button{min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;font-size:1em}
.srv .ages button:hover,.srv .yn button:hover{border-color:var(--pri)}
.srv .yn{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.srv .yn button.yes{background:var(--pri);color:var(--priInk);border-color:var(--pri)}
.svres{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.svbar{display:grid;grid-template-columns:44px 1fr 64px;gap:8px;align-items:center;font-size:.85em}
.svbar i{display:block;height:10px;border-radius:5px;background:var(--pri)}
.svbar span:nth-child(2){background:var(--soft);border-radius:5px;overflow:hidden}
.fbk .svlock{flex-direction:row;display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.fbk .svlock input{flex:1 1 140px;min-width:0;letter-spacing:2px}
.fbk .svlock .btn{flex:0 0 auto;min-height:44px;padding:0 16px}
.svtab{width:100%;border-collapse:collapse;font-size:.9em;margin-top:4px}
.svtab th,.svtab td{border:1px solid var(--line);padding:7px 8px;text-align:center}
.svtab th{background:var(--soft);font-weight:700}
.svtab td:first-child,.svtab th:first-child{text-align:left}
.svtab tr.tot td{font-weight:700;background:var(--bg)}
.svbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.svbtns button{min-height:44px;flex:1 1 140px;border-radius:10px;border:1px solid var(--pri);background:var(--card);color:var(--pri);font-weight:700}
.msg{font-size:.85em;padding:10px 12px;border-radius:10px;background:var(--soft)}
.jmap{position:relative;aspect-ratio:4/3;border-radius:18px;overflow:hidden;background:var(--sea);border:1px solid var(--line)}
.jmap svg{position:absolute;inset:0;width:100%;height:100%}
.cpin{position:absolute;width:44px;height:44px;transform:translate(-50%,-50%);border:0;background:none;padding:0;display:grid;place-items:center}
.cpin i{width:16px;height:16px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.cpin.on i{width:22px;height:22px}
.cpin span{position:absolute;left:50%;top:50%;margin-top:-12px;white-space:nowrap;padding:3px 8px;border-radius:8px;background:var(--card);color:var(--ink);font-size:12px;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.cpin.on span{background:var(--ink);color:var(--bg)}
.cpin small{font-weight:500;opacity:.75}
.rec{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.rcards{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x mandatory}
.rcard{flex:0 0 78%;scroll-snap-align:start;background:var(--soft);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.rcard p{font-size:.88em}
main.full{padding:0;overflow:hidden;position:relative;display:block}
main.full>*{animation:none}
.stage{position:absolute;inset:0;background:var(--sea);overflow:hidden}
.stage.edit{background:var(--map)}
.stage>svg{position:absolute;inset:0;width:100%;height:100%}
.pan{position:absolute;inset:0;touch-action:none;cursor:grab;overflow:hidden}
.pan:active{cursor:grabbing}
.pan>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ovl.col{flex-direction:column;align-items:stretch;pointer-events:none}
.ovl.col>*{pointer-events:auto}
.ovl.col .hint{align-self:flex-start;font-size:.75em;font-weight:500}
.zoom{position:absolute;right:10px;display:flex;flex-direction:column;gap:6px;z-index:4}
.zoom button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:1.3em;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.ovl{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:8px;align-items:center;justify-content:space-between;z-index:3}
.hint{background:var(--card);padding:8px 14px;border-radius:20px;font-size:.85em;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.cdot{position:absolute;pointer-events:none;width:10px;height:10px;border-radius:50%;background:var(--ink);transform:translate(-50%,-50%);border:2px solid var(--card)}
.tagpin{position:absolute;transform:translate(calc(-50% + var(--dx,0%)),calc(-100% - 10px));border:0;background:var(--card);color:var(--ink);border-radius:12px;padding:6px 10px;display:flex;flex-direction:column;align-items:center;line-height:1.2;box-shadow:0 2px 8px rgba(0,0,0,.25);min-height:44px;justify-content:center;z-index:2}
.tagpin::after{content:'';position:absolute;left:calc(50% - var(--dx,0%));bottom:-6px;width:12px;height:12px;background:inherit;transform:translateX(-50%) rotate(45deg);border-radius:2px}
.tagpin.down{transform:translate(calc(-50% + var(--dx,0%)),10px)}
.tagpin.down::after{bottom:auto;top:-6px}
.tagpin b{font-size:.92em}.tagpin span{font-size:.72em;color:var(--sub);white-space:nowrap}
.tagpin.on{background:var(--pri);color:#fff;z-index:4}.tagpin.on span{color:#e8eeff}
.bsheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:20px 20px 0 0;box-shadow:0 -6px 20px rgba(0,0,0,.18);display:flex;flex-direction:column;z-index:5;max-height:100%}
.bsheet.full{height:78%}
.grab{border:0;background:none;height:24px;display:grid;place-items:center;width:100%}
.grab i{width:40px;height:5px;border-radius:3px;background:var(--line)}
.bhead{display:flex;gap:6px;align-items:center;padding:0 12px 8px 16px}
.carousel{display:flex;gap:10px;overflow-x:auto;padding:4px 16px 16px;scroll-snap-type:x mandatory}
.ccard{flex:0 0 82%;scroll-snap-align:center;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:0 0 12px;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.ccard>*:not(.cstrip){padding:0 12px}
.cstrip{color:#fff;font-size:.78em;font-weight:700;padding:6px 12px;margin-bottom:4px}
.blist{overflow-y:auto;padding:4px 16px 16px;display:flex;flex-direction:column;gap:12px}
.daychips{display:flex;gap:6px;overflow-x:auto;flex:1}

function mapHTML(groups){

  const xs = pts.map(p => p.lo * kx), ys = pts.map(p => -p.la);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  const W = 400, H = 300, pad = 46, rx = Math.max(maxX - minX, 0.004), ry = Math.max(maxY - minY, 0.004);
  const s = Math.min((W - pad * 2) / rx, (H - pad * 2) / ry);
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
  const P = p => [W / 2 + (p.lo * kx - cx) * s, H / 2 + (-p.la - cy) * s];
  const kmPer100 = 100 / s * 111.32; const nice = [0.1,0.2,0.5,1,2,5,10,20,50].find(v => v >= kmPer100 * 0.6) || 50; const barPx = nice / 111.32 * s;
  let lines = '', pins = '';

    const xy = g.ids.map(id => P(PL[id]));
    if (xy.length > 1 && !g.near) lines += `<polyline points="${xy.map(a => a.join(',')).join(' ')}" fill="none" stroke="${g.color}" stroke-width="3" stroke-dasharray="7 5" stroke-linecap="round" vector-effect="non-scaling-stroke"/>`;

  });

  return `<div class="map" role="img" aria-label="동선 지도: ${esc(groups.flatMap(g => g.ids.map(id => PL[id].n)).join(', '))}">

    <div class="scale"><span>${nice < 1 ? nice * 1000 + 'm' : nice + 'km'}</span><i style="width:${(barPx / W * 100).toFixed(1)}%"></i></div>

}

function fit(pts, W, H, pad, top, bottom){
  const mid = pts.reduce((a, p) => a + p.la, 0) / pts.length, kx = Math.cos(mid * Math.PI / 180);

  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);

const WM = {};
const WM_OK = /^(cc0|cc[ -]by(-sa)?( \d(\.\d)?)?|public domain|pd\b|attribution)/i;

const PHB = /\/web\/(index\.html)?$/.test(location.pathname) ? '../photos/' : 'photos/';
const MANP = (window.claude && window.claude.use) ? Promise.resolve() :
  fetch(PHB + 'manifest.json', { cache:'no-cache' }).then(r => r.ok ? r.json() : {}).then(m => { Object.entries(m || {}).forEach(([k, v]) => { if (v && v.l && v.l.length && !(WM[k] && WM[k].st === 'ok')) WM[k] = { st:'ok', local:true, l:v.l.map(x => ({ src:PHB + x.f, page:x.page, lic:x.lic, by:x.by })) }; }); }).catch(() => {});
async function wmLoad(id){
  await MANP;
  if (WM[id] || !JA[id]) return wmFill(id); WM[id] = { st:'loading', l:[] };
  try { const c = JSON.parse(sessionStorage.getItem('wm-' + id) || 'null'); if (c){ WM[id] = c; return wmFill(id); } } catch (e) {}
  const q = encodeURIComponent(JA[id] + ' filetype:bitmap');
  const url = 'https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=8&gsrsearch=' + q + '&prop=imageinfo&iiprop=url|extmetadata|mime&iiurlwidth=500';
  try {

    const j = await r.json(), pages = Object.values((j.query || {}).pages || {}).sort((a, b) => (a.index || 0) - (b.index || 0));
    const l = pages.map(p => { const ii = (p.imageinfo || [])[0] || {}, m = ii.extmetadata || {}, lic = ((m.LicenseShortName || {}).value || '').trim();
      return { src:ii.thumburl || ii.url, page:ii.descriptionurl, lic, by:stripH((m.Artist || {}).value).slice(0, 60) || '작자 미상', mime:ii.mime }; })
      .filter(x => x.src && /image\/(jpeg|png|webp)/.test(x.mime || '') && WM_OK.test(x.lic)).slice(0, 4);

const TCID = { '도쿄':228, '오사카':219, '교토':734, '나고야':360, '후쿠오카':248, '삿포로':641, '히로시마':262, '구마모토':4009, '마쓰야마':1698, '기타큐슈':3234 };

function tripDates(){
  const a = pDate(S.tdate); if (!a) return null;
  let b = pDate(S.tend); if (!b || b <= a) b = addD(a, 1);
  const f = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

}
function tripUrl(city){

function toast(t){ let el = $('tst'); if (!el){ el = document.createElement('div'); el.id = 'tst'; el.setAttribute('role', 'status'); document.body.appendChild(el); } el.textContent = t; el.className = 'show'; clearTimeout(toast.tm); toast.tm = setTimeout(() => { el.className = ''; }, 3200); }

  const used = new Set(r.flat()), ids = r[d] || [], c = ids.length ? { la:ids.reduce((a, id) => a + PL[id].la, 0) / ids.length, lo:ids.reduce((a, id) => a + PL[id].lo, 0) / ids.length } : CITY[p.city];
  const hits = id => S.likes.filter(k => tagsOf(id).includes(k)).length;
  const list = cityPlaces(p.city).filter(id => !used.has(id) && likeOk(id)).sort((a, b) => hits(b) - hits(a) || km(c, PL[a]) - km(c, PL[b])).slice(0, 6);
  const head = `<div class="row" style="margin-top:12px"><b class="grow">✨ 내 카테고리 추천 장소·맛집</b><button class="pill" data-a="likes">카테고리 바꾸기</button></div><span class="xs sub">${S.likes.map(k => '#' + INAME[k]).join(' ')} 에 맞는 곳 중 ${d + 1}일차 동선에서 가까운 순이에요.</span>`;
  if (!list.length) return head + `<p class="xs sub">이 도시에는 아직 동선에 없는 맞는 곳이 없어요.</p>`;
  return head + `<div class="lrec">${list.map(id => { const x = PL[id];
    return `<article class="lrc"><button class="lrn" data-a="sel" data-v="${id}"><span class="dic ${x.cat === '맛집' ? 'food' : ''} ${gcl(x)}">${ico(gic(x), 14)}</span><b>${esc(x.n)}</b></button><span class="xs sub">${x.cat} · ${ids.length ? '동선에서 ' + kmT(km(c, x)) : esc(x.when)}</span>${intChips(id)}
      <div class="pact"><button class="mini add" data-a="add" data-v="${id}">+ ${d + 1}일차에 넣기</button><button class="mini info" data-a="place" data-v="${id}" aria-label="정보·리뷰 보기"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 16v-5M12 8h.01"/></svg></button></div></article>`; }).join('')}</div>`;
}
function selCard(id, r, d){

     ${S.scr === 'trip' ? `<button class="tswap" data-a="tswap" data-v="${i}" aria-label="${esc(x.k)} 다른 곳으로 바꾸기">⇄ 바꾸기</button>` : ''}

       <select data-a="today" data-v="${d}:${i}" aria-label="다른 날로 옮기기">${opts}</select><button class="del" data-a="del" data-v="${d}:${i}">빼기</button></div>` : ''}
     ${S.scr === 'detail' ? `<div class="sact"><button class="lic info" data-a="place" data-v="${id}" aria-label="${esc(x.k)} 정보·리뷰 보기"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 16v-5M12 8h.01"/></svg></button><button class="lic del" data-a="del" data-v="${d}:${i}" aria-label="${esc(x.k)} 빼기"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><button class="lic rep" data-a="repstart" data-v="${id}" aria-label="${esc(x.k)} 다른 장소로 교체"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg></button></div>` : ''}
     ${next ? (() => { const g = legInfo(id, next); return `<span class="move">${legIco(g.ic)} ${legBtn(id, next, g)} <button class="lrv" data-a="rvopen" data-v="${legKey(id, next)}" aria-label="이 구간 경로 비교">🗺 경로</button> <a href="${legURL(id, next)}" target="_blank" rel="noopener">길찾기</a>${S.scr === 'detail' ? `<button class="mplus" data-a="insat" data-v="${d}:${i + 1}" aria-label="${i + 1}번과 ${i + 2}번 사이에 장소 추가">+ 사이에 추가</button>` : ''}</span>${legPanel(id, next)}`; })() : ''}</div></div>`;
}

const MOVE_NOTE = '<p class="xs sub mvnote">이동 방법은 가까운 역을 기준으로 어림한 거예요. 정확한 노선과 시간은 ‘길찾기’에서 확인하세요.</p>';
function detail(){

    ${p.draft ? `<div class="pubbox"><b>아직 등록 전이에요</b><span class="xs sub">편집에서 장소를 담은 뒤 등록하면 ${PDB ? '모든 사람이 볼 수 있어요' : '이 브라우저의 동선팩 목록에 올라가요'}.</span><div class="row" style="gap:8px;margin-top:8px"><button class="btn" style="flex:1" data-a="edit">장소 담기·편집</button><button class="btn dark" style="flex:1" data-a="publish">동선팩 등록하기</button></div>${S.pubMsg ? `<p class="xs" style="margin-top:6px;color:var(--pri);font-weight:700">${esc(S.pubMsg)}</p>` : ''}</div>` : S.pubMsg && p.mine ? `<p class="xs" style="margin-top:6px;color:#166534;font-weight:700">${esc(S.pubMsg)}</p>` : ''}</div>

  ${hotelSec(p)}
  </div></div>
  <div class="dmapcol">${detailMap(p, r, groups, all ? -1 : d)}
  <div class="maplinks">${all ? '' : (r[d].length ? `<a href="${gdir(r[d])}" target="_blank" rel="noopener">구글 지도에서 ${d + 1}일차 경로 열기</a>` : '')}${edited(p) ? `<button class="pill" data-a="reset">원래 동선으로</button>` : ''}<button class="pill" data-a="edit">지도 크게 보기</button></div></div>`;

function book(){

  return `<p class="sub">지금 동선에 맞춰 숙소·교통·입장권을 모았어요. 필요 없는 건 빼세요.</p>
  ${p.hotel ? `<h3>숙소 고르기</h3>${(HT[p.city] || []).length ? `<div class="hlist">${hotelsFor(p).map(o => hotelCard(p, o, false)).join('')}</div>` : [[false, p.hotel], [true, p.up]].map(([u, h]) => `<button class="opt ${S.up === u ? 'on' : ''}" aria-pressed="${S.up === u}" data-a="up" data-v="${u}"><span class="grow"><b>${esc(h.name)}</b><span class="xs sub">2인 1실 · 예시 요금 · ${won(h.krw)}</span></span></button>`).join('')}` : '<p class="sub">당일치기라 숙소가 없어요.</p>'}

    return `<button class="opt ${on ? 'on' : ''}" aria-pressed="${on}" data-a="tog" data-v="${i.id}"><span class="box">${on ? check('#fff', 16) : ''}</span><span class="grow"><b style="font-size:.92em">${esc(i.name)}</b><span class="xs sub">${i.kind} · ${esc(i.detail)}</span></span><span class="price" style="font-size:.9em">${won(i.krw)}</span></button>`; }).join('') || '<p class="sub">입장권이 필요한 장소가 없어요.</p>'}
  <p class="xs sub">엔화는 100엔≈850원으로 어림했어요. 항공권은 따로예요.</p>`;
}
const check = (c, n) => `<svg width="${n}" height="${n}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>`;
const chosen = () => items(pack()).filter(i => !S.off[i.id]);

function tripPack(){ return PACKS.find(p => p.id === S.tp) || PACKS.find(p => p.id === 'os1') || PACKS[0]; }
function tripStops(p, d){
  const k = p.id + ':' + d; if (S.tov[k]) return S.tov[k];
  const base = (route(p)[d] || []).slice();
  if (p.id === 'os1' && d === 1 && S.alt) return S.alt === 'swap' ? base.filter(x => x !== 'castle').concat('castle') : base.map(x => x === 'castle' ? 'ebisu' : x);
  return base;
}
function trip(){
  const p = tripPack(), r = route(p), d = Math.min(S.td, r.length - 1), stops = tripStops(p, d), k = p.id + ':' + d, sample = p.id === 'os1' && d === 1 && !S.tov[k] && stops.includes('castle') || (p.id === 'os1' && d === 1 && S.alt && !S.tov[k]);
  const a = S.alt;
  const alert = !sample ? '' : a ? `<div class="done"><b>동선을 바꿨어요</b><span class="sub">${a === 'swap' ? '천수각은 내일 아침으로 미루고 시장부터 가요.' : '천수각 대신 도톤보리 관람차를 넣었어요. 천수각 입장권은 환불 신청했어요.'}</span><button class="pill" style="align-self:flex-start" data-a="alt" data-v="">원래 동선 보기</button></div>`
   : `<div class="warn"><b>오사카성 천수각이 오늘 임시 휴관한다는 알림이 왔어요 (샘플)</b>
     <p style="font-size:.9em">어떻게 바꿀지 골라 보세요. 이동 거리는 실제 위치로 계산해요.</p>
     <div class="alt"><b>순서 바꾸기: 시장 → 전망대, 천수각은 다음 날 아침</b><span class="sub">구로몬시장까지 직선 약 ${kmT(km(PL.castle, PL.kuromon))}</span><button class="btn" style="flex:none;min-height:46px" data-a="alt" data-v="swap">이렇게 바꾸기</button></div>
     <div class="alt"><b>대체 장소: ${esc(PL.ebisu.n)}</b><span class="sub">${esc(PL.ebisu.pts[0])}</span><button class="btn" style="flex:none;min-height:46px" data-a="alt" data-v="ebisu">이렇게 바꾸기</button></div>
     <p class="xs sub" style="margin:0">다른 곳을 직접 고르려면 아래 목록에서 장소마다 있는 「⇄ 바꾸기」를 누르세요.</p></div>`;
  return `<div class="tphead"><div class="grow"><span class="xs sub">${esc(p.city)} ${p.nights} · ${d + 1}일차 오늘${p.id === 'os1' ? ' (샘플 상황)' : ''}</span><h2>${esc(p.title)}</h2></div><button class="pill" data-a="tpopen">동선 바꾸기</button></div>
  ${r.length > 1 ? `<div class="tdays" role="tablist" aria-label="여행 날짜">${r.map((x, i) => `<button class="chip ${i === d ? 'on' : ''}" role="tab" aria-selected="${i === d}" data-a="tday" data-v="${i}">${i + 1}일차 · ${x.length}곳</button>`).join('')}</div>` : ''}

let DB = null, ASSETS = null, REV = {}, revState = 'loading', LOCAL = false;
const LREV = 'dongseon-local-reviews';
/* 깃헙 버전: Firebase(Firestore)를 연결하면 리뷰와 동선팩을 모든 방문자가 함께 봐요 */
async function setupFirebase(){
  const cfg = window.FB_CONFIG; if (!cfg || !cfg.projectId || !cfg.apiKey) return false;
  const load = src => new Promise((ok, no) => { const sc = document.createElement('script'); sc.src = src; sc.onload = ok; sc.onerror = no; document.head.appendChild(sc); });
  try {
    await load('https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js');
    await load('https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js');
    const app = firebase.initializeApp(cfg), fs = firebase.firestore(app);
    DB = { collection:n => fs.collection(n) }; PDB = DB;
    ASSETS = { upload:async b => { const sm = await shrink(b, 720, 0.6); return { id:await new Promise((ok, no) => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.onerror = no; fr.readAsDataURL(sm); }) }; } };
    fs.collection('packs').limit(500).onSnapshot(snap => { snap.docs.forEach(d => addUserPack(d.data())); if (['home', 'make'].includes(S.scr) && !S.place && !S.onb) render(); }, () => {});
    if (S.scr === 'make') render();
    return true;
  } catch (e) { DB = null; PDB = null; ASSETS = null; return false; }
}
function setupLocal(){
  LOCAL = true; let all = []; try { all = JSON.parse(localStorage.getItem(LREV) || '[]'); } catch (e) { all = []; }
  const rebuild = () => { const m = {}; all.forEach(v => { if (v && PL[v.place]) (m[v.place] = m[v.place] || []).push(v); }); Object.values(m).forEach(a => a.sort((x, y) => (y.at || 0) - (x.at || 0))); REV = m; };
  rebuild(); revState = 'ok';
  DB = { collection:() => ({ add:async doc => { all.push(doc); try { localStorage.setItem(LREV, JSON.stringify(all)); } catch (e) { all.pop(); throw { code:'quota_exceeded' }; } rebuild(); } }) };
  ASSETS = { upload:async b => { const sm = await shrink(b, 900, 0.72); return { id:await new Promise((ok, no) => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.onerror = no; fr.readAsDataURL(sm); }) }; } };
  render();
}

const UPD_KEY = 'dongseon-upd-seen', UPD_V = String(UPD.length);
function updNew(){ try { return localStorage.getItem(UPD_KEY) !== UPD_V; } catch (e) { return false; } }
function updOpen(){
  const el = $('upd'), seen = (() => { try { return +localStorage.getItem(UPD_KEY) || 0; } catch (e) { return 0; } })();
  const days = {}; UPD.forEach((u, i) => { const d = u[0].slice(0, 5); (days[d] = days[d] || []).push([i + 1, u]); });
  const md = d => { const [m, dd] = d.split('-'); return `${+m}월 ${+dd}일`; };
  el.innerHTML = `<div class="fkbox"><div class="bh"><h2 id="updt">🆕 업데이트 내역</h2><button class="ib" data-u="x" aria-label="닫기">✕</button></div><div class="bb">
    <button class="lnk" data-u="gde" style="border:0;background:#eef4ff;color:var(--pri);font-weight:800;border-radius:12px;min-height:44px;width:100%;margin-bottom:10px">📖 이용 가이드 보기 ›</button><p class="xs sub" style="margin:0 0 12px">요청이 들어온 순간마다 한 줄씩, 최근 순서로 적었어요. 모두 ${UPD.length}번 업데이트했어요.</p>
    ${Object.keys(days).reverse().map(d => `<section class="uv"><h3>${md(d)} <span class="xs sub" style="font-weight:500">${days[d].length}건</span></h3><ol class="ul">${days[d].slice().reverse().map(([n, u]) => `<li><div class="hd"><span class="no">#${n}</span><span class="tm">${u[0].slice(6)}</span>${seen && n > seen ? '<span class="nw">NEW</span>' : ''}</div><p class="q">💬 ${esc(u[1])}</p><p class="a">✅ ${esc(u[2])}</p></li>`).join('')}</ol></section>`).join('')}
    <button class="btn" data-u="x">확인했어요</button></div></div>`;
  el.hidden = false;
  try { localStorage.setItem(UPD_KEY, UPD_V); } catch (e) {}
  setTimeout(() => { const b = el.querySelector('.bh [data-u]'); b && b.focus({ preventScroll:true }); const bb = el.querySelector('.bb'); if (bb) bb.scrollTop = 0; }, 50);
}
function updClose(){ const el = $('upd'); el.hidden = true; el.innerHTML = ''; render(); const b = document.querySelector('[data-a="upd"]'); b && b.focus(); }
document.addEventListener('click', e => { const el = $('upd'); if (el.hidden) return; if (e.target.closest('[data-u="gde"]')){ el.hidden = true; el.innerHTML = ''; gdeOpen(); return; } if (e.target.closest('[data-u="x"]') || e.target === el) updClose(); });
document.addEventListener('keydown', e => { const el = $('upd'); if (e.key === 'Escape' && !el.hidden){ e.stopImmediatePropagation(); updClose(); } }, true);
/* ---------- 첫 화면 공지: 테스트용 시제품 ---------- */
(function(){
  const el = $('ntc'); let seen = false;
  try { seen = sessionStorage.getItem('dongseon-notice-v1') === '1'; } catch (e) {}
  if (seen) return;
  el.innerHTML = `<div class="fkbox"><div class="bh"><h2 id="ntct">📢 테스트 버전 안내</h2></div><div class="bb">
    <p><b>트립닷컴 신규 서비스 「동선팩」을 시험해 보기 위한 테스트용 페이지예요.</b></p>
    <ul><li>마케팅 전략론 수업 과제로 만든 시제품이라 트립닷컴 공식 서비스가 아니에요.</li>
    <li>예약·결제 화면은 흐름을 보여 주는 견본이라 실제로 예약되거나 돈이 나가지 않아요.</li>
    <li>요금·영업시간은 조사 시점 기준이라 실제와 다를 수 있어요.</li>
    <li>남겨 주신 리뷰·피드백·설문은 마케팅 전략론 과제 보고서에만 쓰여요.</li></ul>
    <div class="nbtns"><button class="btn dark" data-ntc="gde">📖 가이드 보기</button><button class="btn" data-ntc="ok">닫기</button></div><button class="lnk" data-ntc="upd" style="border:0;background:none;color:var(--pri);font-weight:700;min-height:40px;width:100%">🆕 업데이트 내역 보기 ›</button></div></div>`;
  el.hidden = false;
  const close = () => { el.hidden = true; el.innerHTML = ''; try { sessionStorage.setItem('dongseon-notice-v1', '1'); } catch (e) {} };
  el.addEventListener('click', e => { const t = e.target.closest('[data-ntc]'); if (t){ close(); if (t.dataset.ntc === 'upd') updOpen(); if (t.dataset.ntc === 'gde') gdeOpen(); } });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !el.hidden){ e.stopImmediatePropagation(); close(); } }, true);
  setTimeout(() => { const b = el.querySelector('[data-ntc]'); b && b.focus(); }, 50);
})();

let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (S.scr === 'home' || S.scr === 'detail') render(); }, 150); });
render();

(async () => {
  if (!(window.claude && window.claude.use)){ if (!(await setupFirebase())){ setupLocal(); return; } }
  else {
  try { DB = await window.claude.use('db'); } catch (e) { DB = null; }
  try { ASSETS = await window.claude.use('assets'); } catch (e) { ASSETS = null; }
  }
  if (!DB){ revState = 'off'; if (S.place) $('sh').innerHTML = sheet(); return; }
  const t = setTimeout(() => { if (revState === 'loading'){ revState = 'slow'; const el = $('revlist'); if (el && S.place) el.innerHTML = revList(S.place); } }, 10000);
  DB.collection('reviews').limit(1000).onSnapshot(snap => {
    if (!snap.metadata.fromCache) clearTimeout(t);
    const m = {}; snap.docs.forEach(d => { const v = d.data(); if (!v || typeof v.place !== 'string' || !PL[v.place]) return; (m[v.place] = m[v.place] || []).push(v); });
    Object.values(m).forEach(a => a.sort((x, y) => (y.at || 0) - (x.at || 0))); REV = m;
    if (!snap.metadata.fromCache || revState === 'loading') revState = 'ok';
    const el = $('revlist'); if (el && S.place) el.innerHTML = revList(S.place);
    if (S.scr === 'detail' && S.edit && !S.place) render();
  }, () => { clearTimeout(t); revState = 'off'; if (S.place) $('sh').innerHTML = sheet(); });
})();
}
