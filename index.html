<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>동선팩 (무료 지도)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: 차분하고 친절한 여행 앱, 큰 글씨·큰 버튼
   IDEA: 실제 여행자 동선을 실제 좌표 위 번호 핀으로 따라가는 '동선 카드'
   PICTURE: 날짜별 동선 지도(실제 위·경도 비율, 점선 경로, 축척)
   COLOUR and TYPE: 흰 바탕·진남색 글자·파랑 주색·노랑 인증 배지 / Noto Sans KR
   LAYOUT: 휴대폰 한 열, 상단 바 + 스크롤 본문 + 하단 고정 버튼/탭 */
:root{color-scheme:light dark;--bg:light-dark(#f4f6f9,#0f1420);--card:light-dark(#fff,#182033);--ink:light-dark(#141b2b,#eef2f8);--sub:light-dark(#4b5567,#aab4c6);--line:light-dark(#e1e5ec,#2a3550);--pri:light-dark(#1f4fbf,#7ea6ff);--priInk:light-dark(#fff,#0f1420);--soft:light-dark(#eef3ff,#1d2a4a);--yel:#ffd84a;--yelInk:#3a2c00;--warn:light-dark(#fff3e2,#3a2a14);--warnLine:light-dark(#d9821a,#e7a14a);--warnInk:light-dark(#6a3a00,#ffd9a8);--map:light-dark(#e9eef5,#172036);--grid:light-dark(#d6dee9,#24304d);--red:light-dark(#b42318,#ff9b8f);--sea:light-dark(#d9e7f5,#13203a);--land:light-dark(#f6f3ea,#26314c);--coast:light-dark(#b9c4d2,#3d4b6b);--rail:light-dark(#8e99ad,#56637f)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:light-dark(#dfe4ec,#080b12);color:var(--ink);font:16px/1.55 'Noto Sans KR',system-ui,sans-serif;overflow-x:clip}
body.big{font-size:19px}
.app{position:relative;max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;background:var(--bg);box-shadow:0 0 0 1px var(--line);overflow:hidden}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--line);min-height:62px}
header h1{flex:1;margin:0;font-size:1.15em;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button,select{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.ib{width:44px;height:44px;border:0;background:none;display:grid;place-items:center;border-radius:10px;flex-shrink:0}
.pill{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:.85em;white-space:nowrap}
.pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{flex:1;overflow-y:auto;padding:18px 16px 28px;display:flex;flex-direction:column;gap:16px}
h2{margin:0;font-size:1.45em;line-height:1.3;font-weight:900;text-wrap:balance}
h3{margin:0;font-size:1.05em;font-weight:700}
p{margin:0}.sub{color:var(--sub);font-size:.88em}.xs{font-size:.78em}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:18px;border:1px solid var(--line);background:var(--card);font-size:.85em;min-height:40px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
.pack{display:flex;flex-direction:column;text-align:left;padding:0;overflow:hidden;width:100%}
.cover{height:92px;width:100%;display:flex;align-items:flex-end;justify-content:space-between;padding:12px 16px;color:#fff}
.cover b{font-size:1.3em;font-weight:900}.cover span{font-size:.82em}
.pbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;width:100%}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;background:var(--yel);color:var(--yelInk);font-size:.75em;font-weight:700}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;background:var(--soft);font-size:.75em;font-weight:700;white-space:nowrap}
.tag.food{background:light-dark(#fde8dc,#43281a)}
.price{font-weight:700;white-space:nowrap}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabs button{flex:1 0 auto;min-width:64px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:.85em;padding:0 10px}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.map{position:relative;aspect-ratio:4/3;border-radius:16px;overflow:hidden;background:var(--map);border:1px solid var(--line)}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:0}
.pin b{width:30px;height:30px;border-radius:50%;color:#fff;border:3px solid var(--card);display:grid;place-items:center;font-size:13px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.pin span{padding:1px 6px;border-radius:6px;background:var(--card);font-size:11px;font-weight:700;white-space:nowrap;color:var(--ink)}
.scale{position:absolute;left:10px;bottom:8px;font-size:11px;color:var(--sub);display:flex;flex-direction:column;gap:2px}
.scale i{display:block;height:4px;border:2px solid var(--sub);border-top:0}
.mapnote{position:absolute;right:8px;top:8px;font-size:11px;color:var(--sub);background:var(--card);padding:2px 6px;border-radius:6px}
.maplinks{display:flex;gap:8px;flex-wrap:wrap}
.maplinks a{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:12px;background:var(--soft);color:var(--pri);font-weight:700;font-size:.88em;text-decoration:none}
.tl{display:flex;flex-direction:column}
.st{display:flex;gap:12px}
.rail{display:flex;flex-direction:column;align-items:center;width:32px;flex-shrink:0}
.dot{width:32px;height:32px;border-radius:50%;background:var(--pri);color:var(--priInk);display:grid;place-items:center;font-weight:700;font-size:.85em}
.dot.off{background:#8a93a3}.dot.new{background:#d9821a}
.bar{width:2px;flex:1;min-height:18px;background:var(--line)}
.sb{flex:1;display:flex;flex-direction:column;gap:4px;padding-bottom:16px}
.stop{text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.stop b{font-size:1em}
.move{font-size:.78em;color:var(--pri);font-weight:700;margin-top:2px}
.ed{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.ed button,.ed select{min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:0 10px;font-size:.82em;font-weight:700}
.ed .del{color:var(--red)}
.list{padding:16px;display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);text-align:left;width:100%;min-height:58px}
.opt.on{border-color:var(--pri);background:var(--soft)}
.box{width:26px;height:26px;border-radius:7px;border:2px solid #8a93a3;display:grid;place-items:center;flex-shrink:0}
.opt.on .box{background:var(--pri);border-color:var(--pri)}
.grow{flex:1;display:flex;flex-direction:column;gap:2px}
.foot{padding:12px 16px 16px;background:var(--card);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.btns{display:flex;gap:8px}
.btn{flex:1;min-height:54px;border-radius:12px;border:0;background:var(--pri);color:var(--priInk);font-weight:700;padding:0 12px}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--ink)}
.btn.dark{background:var(--ink);color:var(--bg)}
nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--card);border-top:1px solid var(--line)}
nav button{height:62px;border:0;background:none;font-size:.85em;color:var(--sub);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button.on{color:var(--pri);font-weight:700}
.warn{background:var(--warn);border:2px solid var(--warnLine);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;color:var(--warnInk)}
.alt{background:var(--card);color:var(--ink);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
.done{background:var(--soft);border:2px solid var(--pri);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.ok{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 0;text-align:center}
.ok i{width:64px;height:64px;border-radius:50%;background:var(--pri);display:grid;place-items:center}
textarea,input[type=text]{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:16px;background:var(--card);color:var(--ink)}
textarea{resize:none}
a{color:var(--pri)}
.note{font-size:.78em;color:var(--sub);text-align:center}
.sheet{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:5}
.pts{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:.92em}
.srcs{display:flex;flex-direction:column;gap:4px;font-size:.8em}
.stars{display:flex;gap:4px}
.stars button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:1.2em;color:#b8860b}
.stars button.on{background:#fff4cc;border-color:#e5c43a}
.rev{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:4px}
.rev .s{color:#b8860b;letter-spacing:1px}
.msg{font-size:.85em;padding:10px 12px;border-radius:10px;background:var(--soft)}
.jmap{position:relative;aspect-ratio:4/3;border-radius:18px;overflow:hidden;background:var(--sea);border:1px solid var(--line)}
.jmap svg{position:absolute;inset:0;width:100%;height:100%}
.cpin{position:absolute;width:44px;height:44px;transform:translate(-50%,-50%);border:0;background:none;padding:0;display:grid;place-items:center}
.cpin i{width:16px;height:16px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.cpin.on i{width:22px;height:22px}
.cpin span{position:absolute;left:50%;top:50%;margin-top:-12px;white-space:nowrap;padding:3px 8px;border-radius:8px;background:var(--card);color:var(--ink);font-size:12px;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.cpin.on span{background:var(--ink);color:var(--bg)}
.cpin small{font-weight:500;opacity:.75}
.rec{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.rcards{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x mandatory}
.rcard{flex:0 0 78%;scroll-snap-align:start;background:var(--soft);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.rcard p{font-size:.88em}
main.full{padding:0;overflow:hidden;position:relative;display:block}
main.full>*{animation:none}
.stage{position:absolute;inset:0;background:var(--sea);overflow:hidden}
.stage.edit{background:var(--map)}
.stage>svg{position:absolute;inset:0;width:100%;height:100%}
.pan{position:absolute;inset:0;touch-action:none;cursor:grab;overflow:hidden}
.pan:active{cursor:grabbing}
.pan>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ovl.col{flex-direction:column;align-items:stretch;pointer-events:none}
.ovl.col>*{pointer-events:auto}
.ovl.col .hint{align-self:flex-start;font-size:.75em;font-weight:500}
.zoom{position:absolute;right:10px;display:flex;flex-direction:column;gap:6px;z-index:4}
.zoom button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:1.3em;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.ovl{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:8px;align-items:center;justify-content:space-between;z-index:3}
.hint{background:var(--card);padding:8px 14px;border-radius:20px;font-size:.85em;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.cdot{position:absolute;pointer-events:none;width:10px;height:10px;border-radius:50%;background:var(--ink);transform:translate(-50%,-50%);border:2px solid var(--card)}
.tagpin{position:absolute;transform:translate(calc(-50% + var(--dx,0%)),calc(-100% - 10px));border:0;background:var(--card);color:var(--ink);border-radius:12px;padding:6px 10px;display:flex;flex-direction:column;align-items:center;line-height:1.2;box-shadow:0 2px 8px rgba(0,0,0,.25);min-height:44px;justify-content:center;z-index:2}
.tagpin::after{content:'';position:absolute;left:calc(50% - var(--dx,0%));bottom:-6px;width:12px;height:12px;background:inherit;transform:translateX(-50%) rotate(45deg);border-radius:2px}
.tagpin.down{transform:translate(calc(-50% + var(--dx,0%)),10px)}
.tagpin.down::after{bottom:auto;top:-6px}
.tagpin b{font-size:.92em}.tagpin span{font-size:.72em;color:var(--sub);white-space:nowrap}
.tagpin.on{background:var(--pri);color:#fff;z-index:4}.tagpin.on span{color:#e8eeff}
.bsheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:20px 20px 0 0;box-shadow:0 -6px 20px rgba(0,0,0,.18);display:flex;flex-direction:column;z-index:5;max-height:100%}
.bsheet.full{height:78%}
.grab{border:0;background:none;height:24px;display:grid;place-items:center;width:100%}
.grab i{width:40px;height:5px;border-radius:3px;background:var(--line)}
.bhead{display:flex;gap:6px;align-items:center;padding:0 12px 8px 16px}
.carousel{display:flex;gap:10px;overflow-x:auto;padding:4px 16px 16px;scroll-snap-type:x mandatory}
.ccard{flex:0 0 82%;scroll-snap-align:center;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:0 0 12px;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.ccard>*:not(.cstrip){padding:0 12px}
.cstrip{color:#fff;font-size:.78em;font-weight:700;padding:6px 12px;margin-bottom:4px}
.blist{overflow-y:auto;padding:4px 16px 16px;display:flex;flex-direction:column;gap:12px}
.daychips{display:flex;gap:6px;overflow-x:auto;flex:1}
.daychips .chip{white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.epin{position:absolute;transform:translate(-50%,-50%);border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:1px;z-index:2;min-width:32px;min-height:32px}
.epin b{width:30px;height:30px;border-radius:50%;color:#fff;border:3px solid var(--card);display:grid;place-items:center;font-size:12px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.epin span{padding:0 5px;border-radius:5px;background:var(--card);font-size:10.5px;font-weight:700;white-space:nowrap;color:var(--ink)}
.epin.dim{opacity:.55}
.epin.rec b{width:24px;height:24px;background:var(--card);color:#2b6fd6;border:2px solid #2b6fd6;font-size:15px}
.epin.rec.food b{color:#c2410c;border-color:#c2410c}
.epin.rec span{font-weight:500;color:var(--sub)}
.epin.sel{z-index:4}.epin.sel b{outline:3px solid var(--ink);outline-offset:2px}
.legend{position:absolute;left:10px;right:10px;display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--sub);z-index:3}
.legend span{display:flex;align-items:center;gap:4px;background:var(--card);padding:2px 7px;border-radius:8px}
.lg{width:10px;height:10px;border-radius:50%;display:inline-block}.lg.n{background:#1f4fbf}.lg.t{border:2px solid #2b6fd6}.lg.f{border:2px solid #c2410c}
.sc{display:inline-block;height:4px;border:2px solid var(--sub);border-top:0}
.ovl.f2{top:62px;justify-content:flex-start}
.ovl.f2 .chip{display:inline-flex;align-items:center;gap:4px;box-shadow:0 1px 4px rgba(0,0,0,.12);min-height:36px}
.sta{position:absolute;transform:translate(-5px,-50%);display:flex;align-items:center;gap:3px;font-size:10px;font-weight:700;color:var(--sub);pointer-events:none;z-index:1;white-space:nowrap;text-shadow:0 0 3px var(--map),0 0 3px var(--map)}
.sta i{width:10px;height:10px;border:2px solid var(--rail);background:var(--card);border-radius:3px;flex-shrink:0}
.lg.r{width:16px;height:5px;border-radius:2px;background:var(--rail)}
.epin.rec b{width:30px;height:30px}
.epin span em{font-style:normal;color:#b8860b}
.epanel.card{gap:8px}
.pcar{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 6px;margin:0 -4px}
.pc{flex:0 0 86%;scroll-snap-align:center;border:1px solid var(--line);border-radius:14px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;cursor:pointer}
.pc.on{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri)}
.ph{height:96px;display:flex;gap:2px;position:relative;background:var(--soft);flex-shrink:0}
.ph img{flex:1;min-width:0;height:100%;object-fit:cover}
.ph.none{flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#2b6fd6;font-size:.75em;font-weight:600;background:linear-gradient(135deg,light-dark(#e6efff,#1d2a4a),light-dark(#f4f8ff,#16203a))}
.ph.none.food{color:#c2410c;background:linear-gradient(135deg,light-dark(#fde8dc,#43281a),light-dark(#fff6f0,#2f1f16))}
.ph .more{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.65);color:#fff;border-radius:8px;padding:1px 7px;font-size:.75em}
.pcb{padding:9px 12px 10px;display:flex;flex-direction:column;gap:3px;min-width:0}
.pn{font-size:1em;line-height:1.3}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rt{color:#b8860b;font-weight:700;font-size:.85em}
.pact{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px}
.mini{min-height:38px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:.8em;font-weight:700}
.mini.add{background:var(--pri);color:var(--priInk);border-color:var(--pri)}
.mini.del{color:var(--red)}
.mini:disabled{opacity:.4}
.plist{display:flex;flex-direction:column;gap:12px;overflow-y:auto}
.pl{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg);flex-shrink:0}
.pl.on{border-color:var(--pri)}
.pl .ph{height:120px}
.pname{border:0;background:none;padding:0;text-align:left;min-height:36px;font-size:1em}
.gal .ph{height:150px;border-radius:14px;overflow:hidden}
.rph{display:flex;gap:4px}.rph img{width:88px;height:88px;object-fit:cover;border-radius:8px}
.phin{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative}.thumb img{width:72px;height:72px;object-fit:cover;border-radius:10px;display:block}
.thumb button{position:absolute;top:-8px;right:-8px;width:28px;height:28px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-weight:700}
.addph{width:72px;height:72px;border:2px dashed var(--line);border-radius:10px;display:grid;place-items:center;font-size:.8em;font-weight:700;color:var(--pri);cursor:pointer;position:relative;overflow:hidden}
.addph input{position:absolute;inset:0;opacity:0;cursor:pointer}
.reco{background:var(--soft);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.ok2{color:#14795a;font-weight:700}
.drow{display:flex;gap:8px;align-items:center}
.dname{flex:1;display:flex;gap:8px;align-items:center;text-align:left;border:0;background:var(--card);border-radius:10px;padding:6px 8px;min-height:48px;min-width:0}
.dname b{display:block;font-size:.88em}

 ameyoko:{ n:'우에노 아메요코 시장', k:'아메요코', c:'도쿄', la:35.7101, lo:139.7745, cat:'맛집', fee:null, feeT:'입장 무료 · 먹거리 별도', when:'정오 또는 오후 5~7시', pts:['우에노역과 오카치마치역 사이 약 500m 거리에 가게가 400곳 넘게 모여 있어요.','시장 분위기를 즐기며 쇼핑하다 보면 오후가 금방 지나간다는 후기가 있어요.','노점과 작은 식당은 현금만 받는 곳이 많아요. 정오나 오후 5~7시가 구경하기 좋아요.'], src:[['아메요코 상점가 (GOOD LUCK TRIP)','https://www.gltjp.com/ko/directory/item/11018/'],['우에노 쇼핑 BEST 5 (트립스토어)','https://www.tripstore.kr/blog/%EB%8F%84%EC%BF%84-%EC%9A%B0%EC%97%90%EB%85%B8-%EC%87%BC%ED%95%91-%EA%B0%80%EC%84%B1%EB%B9%84-%EC%BD%94%EC%8A%A4']] },

 harukas:{ n:'아베노 하루카스 300 전망대', k:'하루카스', c:'오사카', la:34.6463, lo:135.5133, cat:'관광', fee:null, feeT:'요금 현장·온라인 확인', when:'해 질 무렵', pts:['아베노 하루카스 58~60층에 있는, 오사카에서 가장 높은 전망대예요.','난바에서 미도스지선으로 덴노지역까지 환승 없이 약 10분 걸려요.','에비스초역에서 내려 신세카이 거리를 구경하며 20분쯤 걸어가는 코스도 많이 가요.'], src:[['하루카스 300 가이드 (Enjoy Osaka Kyoto Kobe)','https://enjoy-osaka-kyoto-kobe.com/ko/article/a/harukas-300-observatory/'],['하루카스 300 총정리 (트립닷컴 블로그)','https://kr.trip.com/blog/harukas300/']] },

function mapHTML(groups){
  const pts = groups.flatMap(g => g.ids.map(id => PL[id]));
  if (!pts.length) return `<div class="map" style="display:grid;place-items:center"><p class="sub">이 날은 정해진 장소가 없어요. 아래에서 장소를 추가해 보세요.</p></div>`;
  const mid = pts.reduce((a, p) => a + p.la, 0) / pts.length, kx = Math.cos(mid * Math.PI / 180);
  const xs = pts.map(p => p.lo * kx), ys = pts.map(p => -p.la);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  const W = 400, H = 300, pad = 46, rx = Math.max(maxX - minX, 0.004), ry = Math.max(maxY - minY, 0.004);
  const s = Math.min((W - pad * 2) / rx, (H - pad * 2) / ry);
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
  const P = p => [W / 2 + (p.lo * kx - cx) * s, H / 2 + (-p.la - cy) * s];
  const kmPer100 = 100 / s * 111.32; const nice = [0.1,0.2,0.5,1,2,5,10,20,50].find(v => v >= kmPer100 * 0.6) || 50; const barPx = nice / 111.32 * s;
  let lines = '', pins = '';
  groups.forEach(g => {
    const xy = g.ids.map(id => P(PL[id]));
    if (xy.length > 1) lines += `<polyline points="${xy.map(a => a.join(',')).join(' ')}" fill="none" stroke="${g.color}" stroke-width="3" stroke-dasharray="7 5" stroke-linecap="round" vector-effect="non-scaling-stroke"/>`;
    g.ids.forEach((id, i) => { const [x, y] = xy[i]; pins += `<button class="pin" data-a="place" data-v="${id}" style="left:${(x / W * 100).toFixed(2)}%;top:${(y / H * 100).toFixed(2)}%" aria-label="${esc(PL[id].n)} 후기 보기"><b style="background:${g.color}">${g.label ? g.label + '-' : ''}${i + 1}</b><span>${esc(PL[id].k)}</span></button>`; });
  });
  let grid = ''; for (let i = 1; i < 8; i++) grid += `<line x1="${i * 50}" y1="0" x2="${i * 50}" y2="300" stroke="var(--grid)" stroke-width="1"/>`; for (let i = 1; i < 6; i++) grid += `<line x1="0" y1="${i * 50}" x2="400" y2="${i * 50}" stroke="var(--grid)" stroke-width="1"/>`;
  return `<div class="map" role="img" aria-label="동선 지도: ${esc(groups.flatMap(g => g.ids.map(id => PL[id].n)).join(', '))}">
    <svg viewBox="0 0 400 300" preserveAspectRatio="none" aria-hidden="true">${grid}${lines}</svg>${pins}
    <div class="scale"><span>${nice < 1 ? nice * 1000 + 'm' : nice + 'km'}</span><i style="width:${(barPx / W * 100).toFixed(1)}%"></i></div>
    <div class="mapnote">실제 위치 비율 · 북쪽 위</div></div>`;
}

  return html + `<p class="xs sub">이동 시간은 가까운 역 기준 어림값이에요.</p></div>`;

/* 전체 일정 한 줄 */

    ${ids.map((id, i) => { const on = S.sel === id, first = g === 0, last = g === total - 1; g++;
      return `${i ? `<span class="sleg">${minT(legInfo(ids[i - 1], id).m)}</span>` : ''}<span class="sst ${on ? 'on' : ''}">${on ? `<button class="sx" data-a="shift" data-v="${k}:${i}:-1" ${first ? 'disabled' : ''} aria-label="앞으로 옮기기">◀</button>` : ''}<button class="sn" data-a="sel" data-v="${on ? '' : id}" aria-label="${k + 1}일차 ${i + 1}번 ${esc(PL[id].n)}${on ? ', 선택됨' : ''}"><b>${i + 1}</b>${esc(PL[id].k)}</button>${on ? `<button class="sx" data-a="shift" data-v="${k}:${i}:1" ${last ? 'disabled' : ''} aria-label="뒤로 옮기기">▶</button><button class="sx del" data-a="del" data-v="${k}:${i}" aria-label="빼기">✕</button>` : ''}</span>`; }).join('')}
    <button class="sadd" data-a="addto" data-v="${k}" aria-label="${k + 1}일차에 장소 추가">+</button></div>`).join('');
}

/* ---------- 동선 편집: 지도에서 보기 ---------- */

  const arrows = (r[d] || []).slice(0, -1).map((id, i) => { const [x1, y1] = P(PL[id].lo, PL[id].la), [x2, y2] = P(PL[r[d][i + 1]].lo, PL[r[d][i + 1]].la), mx = (x1 + x2) / 2, my = (y1 + y2) / 2, ang = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;
    return `<g transform="translate(${mx.toFixed(1)},${my.toFixed(1)}) rotate(${ang.toFixed(1)})"><path d="M-6,-6 L4,0 L-6,6" fill="none" stroke="${COLORS[d % 5]}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>`; }).join('');
  const mf = S.mf || '전체', sd = STA[p.city] || { st:[], ln:[] }, pl = ([la, lo]) => P(lo, la).map(v => v.toFixed(1)).join(',');

    + (sd.fe || []).map(l => `<polyline points="${l.map(pl).join(' ')}" fill="none" stroke="#2b8fd6" stroke-width="2.5" stroke-dasharray="3 6" vector-effect="non-scaling-stroke"/>`).join('');

  const pins = cp.map(id => { const [x, y] = P(PL[id].lo, PL[id].la), w = where[id], sel = S.sel === id, x0 = PL[id], t = rate(id);
    if (w){ const [k, i] = w, cur = k === d;

  const kmPer = 80 / P.s * 111.32, nice = [0.1,0.2,0.5,1,2,5,10,20].find(v => v >= kmPer * 0.6) || 20;

function placeActs(id, r, d, where){

let DB = null, ASSETS = null, REV = {}, revState = 'loading', LOCAL = false;
const LREV = 'dongseon-local-reviews';
function setupLocal(){
  LOCAL = true; let all = []; try { all = JSON.parse(localStorage.getItem(LREV) || '[]'); } catch (e) { all = []; }
  const rebuild = () => { const m = {}; all.forEach(v => { if (v && PL[v.place]) (m[v.place] = m[v.place] || []).push(v); }); Object.values(m).forEach(a => a.sort((x, y) => (y.at || 0) - (x.at || 0))); REV = m; };
  rebuild(); revState = 'ok';
  DB = { collection:() => ({ add:async doc => { all.push(doc); try { localStorage.setItem(LREV, JSON.stringify(all)); } catch (e) { all.pop(); throw { code:'quota_exceeded' }; } rebuild(); } }) };
  ASSETS = { upload:async b => { const sm = await shrink(b, 900, 0.72); return { id:await new Promise((ok, no) => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.onerror = no; fr.readAsDataURL(sm); }) }; } };
  render();
}
function revList(id){
  const l = REV[id] || [];
  if (revState === 'loading') return '<p class="sub">리뷰를 불러오는 중이에요…</p>';
  if (revState === 'off') return '<p class="msg">이 화면에서는 리뷰를 저장하거나 불러올 수 없어요. Claude에 로그인한 상태에서 이 앱 링크를 열면 리뷰가 저장되고, 함께 보는 사람들에게도 보여요.</p>';
  const slow = revState === 'slow' ? '<p class="msg">리뷰 서버 응답이 늦어요. 잠시 뒤 다시 확인해 주세요.</p>' : '';
  const loc = LOCAL ? '<p class="xs sub">이 파일 버전에서는 리뷰와 사진이 지금 쓰는 브라우저에만 저장돼요.</p>' : '';
  if (!l.length) return loc + slow + '<p class="sub">아직 리뷰가 없어요. 첫 리뷰를 남겨 주세요.</p>';
  const avg = l.reduce((a, r) => a + (+r.stars || 0), 0) / l.length;
  return loc + slow + `<p><b>평균 ${avg.toFixed(1)}점</b> <span class="sub">· 리뷰 ${l.length}개</span></p>` + l.map(r => `<div class="rev"><span><span class="s">${'★'.repeat(+r.stars || 0)}${'☆'.repeat(5 - (+r.stars || 0))}</span> <b style="font-size:.9em">${esc(r.name || '익명')}</b> <span class="xs sub">${r.at ? new Date(r.at).toLocaleDateString('ko-KR') : ''}</span></span><p style="font-size:.92em;white-space:pre-wrap">${esc(r.text)}</p>${Array.isArray(r.photos) && r.photos.length ? `<div class="rph">${r.photos.filter(okPh).slice(0, 3).map(p => `<img src="${psrc(p)}" alt="리뷰 사진" loading="lazy">`).join('')}</div>` : ''}</div>`).join('');
}

/* 한국어 지명 지도 (OpenFreeMap 벡터 지도, 한국어 이름이 있으면 한국어로) */
function koLayer(){
  if (!(window.L && L.maplibreGL && window.maplibregl)) return null;
  const l = L.maplibreGL({ style:'https://tiles.openfreemap.org/styles/liberty', attribution:'&copy; OpenFreeMap &copy; OpenMapTiles &copy; OpenStreetMap contributors', localIdeographFontFamily:"'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" });
  const fix = m => { try { (m.getStyle().layers || []).forEach(ly => { if (ly.type === 'symbol' && ly.layout && ly.layout['text-field']) m.setLayoutProperty(ly.id, 'text-field', ['coalesce', ['get', 'name:ko'], ['get', 'name']]); }); } catch (e) {} };

  mf:v => { S.mf = v; render(); },
  rmph:v => { const f = R.files.splice(+v, 1)[0]; if (f) try { URL.revokeObjectURL(f.url); } catch (e) {} $('sh').innerHTML = sheet(); },
  rf:v => { S.rf = v; render(); },
  open:v => { S.up = false; S.off = {}; const p = PACKS.find(x => x.id === v); go({ scr:'detail', pid:v, city:p.city, day:-1, edit:false }); },
  day:v => { S.day = +v; S.rprev = false; render(); },
  edit:() => { S.edit = !S.edit; S.sel = null; S.pl = ''; S.chg = false; S.rprev = false; if (S.edit && S.day < 0) S.day = 0; render(); $('mn').scrollTop = 0; },
  reset:() => { delete S.routes[S.pid]; try { localStorage.setItem(SAVE_KEY, JSON.stringify(S.routes)); } catch (e) {} render(); },
  mv:v => { const [d, i, k] = v.split(':').map(Number), r = route(pack()).map(x => x.slice()), j = i + k; if (j < 0 || j >= r[d].length) return; [r[d][i], r[d][j]] = [r[d][j], r[d][i]]; setRoute(r); S.chg = true; S.rprev = false; render(); },
  del:v => { const [d, i] = v.split(':').map(Number), r = route(pack()).map(x => x.slice()); r[d].splice(i, 1); setRoute(r); S.chg = true; S.rprev = false; if (!S.edit) S.sel = null; render(); },
  add:v => { const r = route(pack()).map(x => x.slice()), d = S.day === -1 ? 0 : S.day; r[d].push(v); setRoute(r); S.chg = true; S.rprev = false; if (S.edit) S.sel = v; render(); },
  up:v => { S.up = v === 'true'; render(); },
  tog:v => { S.off = { ...S.off, [v]:!S.off[v] }; render(); },
  pay:() => go({ scr:'paid', shared:false }),
  share:() => { S.shared = true; render(); },
  alt:v => { S.alt = v || null; render(); },
  load:() => { S.loaded = true; render(); },
  made:() => { S.made = true; render(); },
  place:v => { R.msg = ''; S.place = v; render(); },
  close:() => { S.place = null; render(); },
  star:v => { R.stars = +v; $('sh').innerHTML = sheet(); }
};
document.addEventListener('click', e => { if (suppress){ suppress = false; if (e.target.closest('.pan')){ e.preventDefault(); return; } } const b = e.target.closest('[data-a]'); if (!b || b.tagName === 'SELECT') return; e.preventDefault(); const f = A[b.dataset.a]; if (f) f(b.dataset.v, b); });
document.addEventListener('change', e => { const t = e.target; if (t.dataset && t.dataset.a === 'today'){ const [d, i] = t.dataset.v.split(':').map(Number), to = +t.value; if (to === d) return; const r = route(pack()).map(x => x.slice()); const [id] = r[d].splice(i, 1); r[to].push(id); setRoute(r); S.chg = true; render(); } });
async function shrink(f, max = 1600, q = 0.82){
  const bmp = await createImageBitmap(f), k = Math.min(1, max / Math.max(bmp.width, bmp.height)), c = document.createElement('canvas');
  c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k); c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise((ok, no) => c.toBlob(b => b ? ok(b) : no(new Error('blob')), 'image/jpeg', q));
}
document.addEventListener('change', async e => { if (e.target.id !== 'rphoto') return;
  const fs = [...e.target.files].filter(f => /^image\//.test(f.type)).slice(0, 3 - R.files.length);
  for (const f of fs){ try { const b = await shrink(f); R.files.push({ blob:b, url:URL.createObjectURL(b) }); } catch (err) { R.msg = '사진 하나를 읽지 못했어요.'; } }
  $('sh').innerHTML = sheet(); });
document.addEventListener('input', e => { if (e.target.id === 'rname') R.name = e.target.value; if (e.target.id === 'rtext') R.text = e.target.value; });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.place){ S.place = null; render(); } });
document.addEventListener('submit', async e => {
  if (e.target.id !== 'revform') return; e.preventDefault();
  const text = R.text.trim(), name = R.name.trim().slice(0, 20) || '익명';
  const say = m => { R.msg = m; const el = $('rmsg'); if (el){ el.hidden = false; el.className = 'msg'; el.textContent = m; } };
  if (!R.stars) return say('별점을 골라 주세요.');
  if (text.length < 2) return say('리뷰 내용을 두 글자 이상 적어 주세요.');
  if (!DB) return say('지금은 리뷰를 저장할 수 없어요.');
  R.busy = true; $('sh').innerHTML = sheet();
  try { const photos = [];
    if (R.files.length){ if (!ASSETS) throw { code:'no_assets' }; for (const f of R.files){ const up = await ASSETS.upload(f.blob); photos.push(up.id); } }
    await DB.collection('reviews').add({ place:S.place, stars:R.stars, name, text:text.slice(0, 500), photos, at:Date.now() });
    R.files.forEach(f => { try { URL.revokeObjectURL(f.url); } catch (e) {} }); R.files = []; R.text = ''; R.stars = 0; R.msg = '리뷰를 올렸어요. 고마워요!'; if (LOCAL && S.scr === 'detail' && S.edit) render(); }
  catch (err) { R.msg = err && err.code === 'invalid_argument' ? '리뷰를 쓸 권한이 없어요. 이 앱을 공유받을 때 참여자(Contributor) 이상 권한이 있어야 리뷰를 쓸 수 있어요.' : err && err.code === 'no_assets' ? '사진을 올릴 권한이 없어요. 사진을 빼고 다시 올려 주세요.' : err && err.code === 'quota_exceeded' ? '저장 공간이 가득 찼어요.' : '리뷰를 저장하지 못했어요. 잠시 뒤 다시 시도해 주세요.'; }
  R.busy = false; $('sh').innerHTML = sheet();
});

let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (S.scr === 'home' || S.edit) render(); }, 150); });
render();

(async () => {
  if (!(window.claude && window.claude.use)){ setupLocal(); return; }
  try { DB = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch (e) { DB = null; }
  try { ASSETS = window.claude && window.claude.use ? await window.claude.use('assets') : null; } catch (e) { ASSETS = null; }
  if (!DB){ revState = 'off'; if (S.place) $('sh').innerHTML = sheet(); return; }
  const t = setTimeout(() => { if (revState === 'loading'){ revState = 'slow'; const el = $('revlist'); if (el && S.place) el.innerHTML = revList(S.place); } }, 10000);
  DB.collection('reviews').limit(1000).onSnapshot(snap => {
    if (!snap.metadata.fromCache) clearTimeout(t);
    const m = {}; snap.docs.forEach(d => { const v = d.data(); if (!v || typeof v.place !== 'string' || !PL[v.place]) return; (m[v.place] = m[v.place] || []).push(v); });
    Object.values(m).forEach(a => a.sort((x, y) => (y.at || 0) - (x.at || 0))); REV = m;
    if (!snap.metadata.fromCache || revState === 'loading') revState = 'ok';
    const el = $('revlist'); if (el && S.place) el.innerHTML = revList(S.place);
    if (S.scr === 'detail' && S.edit && !S.place) render();
  }, () => { clearTimeout(t); revState = 'off'; if (S.place) $('sh').innerHTML = sheet(); });
})();
}
