name: 사진 받기 (Wikimedia Commons)

on:
  push:
    branches: [main]
    paths:
      - 'photos/queries.json'
      - 'scripts/fetch_photos.mjs'
      - '.github/workflows/photos.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: photos
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Commons 사진 내려받기
        run: node scripts/fetch_photos.mjs
      - name: 저장소에 올리기
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photos
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "사진 업데이트 (Wikimedia Commons, 촬영자·라이선스는 photos/manifest.json)"
          git push
